[project]
name = "penipuan-detection-backend"
version = "0.1.0"
description = "Sistem Pendeteksi Pesan Penipuan Online - FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Make the classification explicit so import order does not depend on heuristics.
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `app` package importable from tests without an installed distribution.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
